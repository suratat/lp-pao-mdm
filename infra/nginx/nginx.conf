# T6: reverse proxy หน้า api x2 replica ตามภาคผนวก ค ("mdm-api x2 replica หลัง Traefik/Nginx")
# ไม่มี TLS ที่ชั้นนี้ - เครือข่ายภายใน docker เท่านั้น ภาคผนวก ค ระบุว่า production รับเฉพาะจาก private IP
# ของ sso-server และ backend ของระบบปลายทาง (ทำที่ firewall ของ VM จริง) ไม่ตั้ง ingress ผ่าน Cloudflare
# Tunnel สำหรับ /api - เรื่อง TLS/allow-list ระดับ perimeter จึงอยู่นอกขอบเขตของ compose นี้
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # log ห้ามมี query string (เช่น ?q= ชื่อบุคคลที่ HR ค้นหา) - ใช้ $uri (path ล้วน) แทน $request/$request_uri
  # ที่ default format "combined" ใช้ และตัด $http_referer ออก; ยังเก็บ status / เวลา / upstream ไว้ตรวจสอบ
  # ไม่มี rewrite/internal redirect ใน config นี้ $uri จึงเท่ากับ path ที่ client ส่งมา (ผ่าน decode+normalize แล้ว)
  log_format mdm '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time us=$upstream_status '
                 'ua="$http_user_agent"';
  access_log /dev/stdout mdm;

  # error_log เขียนบรรทัด request: "GET /path?query" และ upstream: "http://.../path?query" เมื่อ upstream ล้ม (ระดับ error)
  # และ format ปรับไม่ได้ จึงเปิดเฉพาะ crit ขึ้นไป - อาการ 502/timeout ดูจาก access log (status, us=, urt=) แทน
  error_log /dev/stderr crit;

  # resolve ชื่อ api1/api2 ใหม่ทุก 10 วินาทีผ่าน DNS ของ docker ทำให้ recreate container (IP เปลี่ยน)
  # แล้วไม่ต้อง reload nginx (ไม่งั้นได้ 502) - `server ... resolve` ต้องใช้ nginx >= 1.27.3
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream mdm_api {
    zone mdm_api 64k;
    server api1:3000 resolve;
    server api2:3000 resolve;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://mdm_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
