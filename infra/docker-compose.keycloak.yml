# Keycloak แบบ persistent (production mode) - เชื่อมต่อ Postgres database "keycloak"
# ที่ roles-bootstrap สร้างให้ (ดู postgres/bootstrap-roles.sql)
# ใช้แทน docker-compose.smoketest.yml ซึ่งเป็น start-dev ชั่วคราวเท่านั้น (ข้อมูลหายเมื่อ restart)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--cache=local", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD: ${KEYCLOAK_SVC_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "3"
      # KC_HOSTNAME ต้องเป็น URL เต็ม (scheme+host) ตาม Keycloak v26 hostname v2 API (ค่า default ตั้งแต่
      # v26 ไม่ใช่ v1 แบบเดิม) - ห้ามตั้ง KC_HOSTNAME_PORT คู่กัน เพราะ v2 ไม่มี option นี้แล้ว (เป็นของ v1
      # เก่า) ตั้งคู่กันแล้วชนกัน เกิด warning และ Admin Console โหลดไม่สำเร็จ (ค้างที่ "Loading the
      # Administration Console") - พบและยืนยันจริงบน VM production (192.168.0.5, WireGuard) หลัง Cloudflare
      # Tunnel ชี้ iam.lp-pao.go.th มาที่ container นี้แล้ว 2026-09-19
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PUBLIC_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      roles-bootstrap:
        condition: service_completed_successfully
    networks: [mdm-internal]
